[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentest"
version = "1.0.0"
description = "AgenTest: mining business rules to test LLM agents for business logic bugs"
license = {text = "MIT"}
requires-python = ">=3.12,<3.14"
dependencies = ["jsonschema>=4.21", "referencing>=0.35"]

[project.optional-dependencies]
figures = ["matplotlib>=3.8"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
